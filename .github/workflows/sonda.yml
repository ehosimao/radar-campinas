name: Sondagem da API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 coletor/sondar.py
      - run: |
          git config user.name "radar-campinas-bot"
          git config user.email "radar-campinas-bot@users.noreply.github.com"
          git add data/sonda.json
          git commit -m "Sondagem da API" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
