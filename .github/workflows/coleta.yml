name: Coleta diária

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # 03:17 em Brasília

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados da Câmara
        id: coleta
        continue-on-error: true
        run: python coletor/coletar.py
      - name: Gravar no repositório
        run: |
          git config user.name "radar-campinas-bot"
          git config user.email "radar-campinas-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Coleta $(date -u +%Y-%m-%d) (${{ steps.coleta.outcome }})"
            git push
          fi
      - name: Falhar se a coleta falhou
        if: steps.coleta.outcome != 'success'
        run: exit 1
